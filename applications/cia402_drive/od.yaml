# Object dictionary source of truth -- the part every variant shares.
#
# This file is a base, not a device: it declares no axis count and no product
# code, so it cannot be generated on its own. The buildable descriptions are in
# variants/, each of which names this file as its base and overrides only what
# genuinely differs. That keeps the ~200 lines of object definitions in one
# place; three copies of them would reintroduce exactly the drift this
# generator exists to remove.
#
# tools/gen_od.py turns this into slave_objectlist.c, utypes.h and
# ecat_options.h (and later the ESI and SII). Nothing downstream is
# hand-edited: the SyncManager arithmetic, the PDO mapping words, the
# ascending index order and the terminating sentinel are all things
# ESC_checkSM23 or SDO_findobject punish silently when got wrong by hand,
# and all of them are mechanical.
#
# See docs/cia402-roadmap.md section 4 for why this exists.

device:
  # Identity. The ETG evaluation range is a placeholder: an assigned Vendor ID
  # is a prerequisite before any unit ships, because masters match on this and
  # it is baked into both the ESI and the SII image.
  #
  # product_code and name are per variant and live in variants/. A master
  # matches on Vendor ID, Product Code and Revision, so two variants sharing an
  # identity while presenting different process images is the worst failure
  # available: the master configures from whichever ESI it holds and the slave
  # refuses at SAFEOP with a code that says nothing about the real cause.
  vendor_id:    0x1337        # TODO: replace with an assigned ETG Vendor ID
  vendor_name:  "cortexware"
  revision:     0x0001
  serial:       0
  group:        "drives"
  group_name:   "CiA402 Drives"

axes:
  # `count` is declared per variant. The stride is fixed by the profile and is
  # also what caps the design: axis 7 lands at 0x9800-0x9FFF and axis 8 would
  # start at 0xA000, outside the CiA402 profile area. Process RAM is nowhere
  # near the limit by comparison -- eight axes plus an I/O block needs about
  # 0x4A0 bytes of the 4 KB available -- so the index space is the ceiling.
  stride:  0x800              # CiA402: axis n at index + n*0x800

mailbox:
  size:       256             # up from the 128 the demo used: SDO-Info over a
                              # large dictionary segments constantly at 128
  size_boot:  256
  buffers:    3
  complete_access: true       # esc_coe.c implements SDO upload and download
                              # with complete access and dispatches both, so
                              # the ESI should say so
  foe:        false           # nothing calls FOE_config(), so foe_cfg is NULL
                              # and the first FoE request dereferences it. The
                              # ESI is what invites that request, so this key
                              # drives USE_FOE, <FoE/> and <BootStrap> together
                              # and they cannot disagree. Turn on with the
                              # firmware update story, not before.

sync_managers:
  # Constraint from esc.c:752 -- SM2_sma + 3*length <= SM3_sma, because a
  # buffered SM consumes three copies. Sizes below are per-axis * reserve.
  mbx_out: 0x1000
  mbx_in:  0x1100
  outputs: 0x1200
  inputs:  0x1300
  # Set bit 6 of SM2's control byte, Watchdog Trigger Enable. Without it the
  # SyncManager never feeds the ESC process data watchdog, 0x0440 reads expired
  # however much data arrives, and the watchdog reaction in DIG_process can
  # never fire -- verified on hardware. The byte has to agree between the ESI
  # and ecat_options.h or ESC_checkSM23 refuses PREOP->SAFEOP, which is why it
  # is one key here rather than two constants.
  watchdog: true

# ---------------------------------------------------------------------------
# Process data. Order here is the wire order.
#
# Deliberately widest-first so every 32-bit value lands naturally aligned:
# in index order, the single-byte modes-of-operation object pushes each
# int32 onto an odd offset. Nothing in the protocol requires this ordering --
# the master reads it from 0x1600/0x1A00 -- and it costs nothing.
# ---------------------------------------------------------------------------

# One PDO per axis, generated from this template: axis n gets index + n, so a
# four-axis variant has 0x1600 through 0x1603 all assigned to SM2 through
# 0x1C12. An I/O block, when the carrier design settles what it carries, is an
# extra pair declared as `rxpdo_extra` / `txpdo_extra` rather than entries
# appended here -- which keeps the axis image byte-identical across variants
# and independent of whatever else is fitted.
rxpdo:
  index: 0x1600
  name: "RxPDO Drive"
  entries:
    - {object: 0x607A, name: TargetPosition}
    - {object: 0x60FF, name: TargetVelocity}
    - {object: 0x6040, name: Controlword}
    - {object: 0x6071, name: TargetTorque}
    - {object: 0x6072, name: MaxTorque}
    - {object: 0x6060, name: ModesOfOperation}
    - {pad: 8}

txpdo:
  index: 0x1A00
  name: "TxPDO Drive"
  entries:
    - {object: 0x6064, name: PositionActual}
    - {object: 0x606C, name: VelocityActual}
    - {object: 0x60F4, name: FollowingErrorActual}
    - {object: 0x2000, sub: 1, name: GateDriverFaults}
    - {object: 0x2000, sub: 2, name: DriveStatusFlags}
    - {object: 0x6041, name: Statusword}
    - {object: 0x6077, name: TorqueActual}
    - {object: 0x603F, name: ErrorCode}
    - {object: 0x6061, name: ModesOfOperationDisplay}
    - {pad: 8}

# ---------------------------------------------------------------------------
# Objects. `var` holds the C path under the generated Obj struct; objects
# without one are constants served from the dictionary itself.
#
# `object_code` is the CoE object code the profile defines for the object. It
# defaults to `var` for a scalar and `record` for anything with sub-entries,
# which is what the drive profile specifies for every object below; set it to
# `array` only where the profile genuinely defines a homogeneous array, because
# for an ARRAY esc_coe.c reports sub 0's UNSIGNED8 as the element type in the
# object description. It is not inferred from the shape of the sub-entries:
# that inference made 0x1018, 0x608F, 0x6091 and 0x6092 arrays.
# ---------------------------------------------------------------------------

objects:

  # --- communication ------------------------------------------------------
  - {index: 0x1000, name: "Device Type",       type: u32, access: ro, value: 0x00020192}
  # Error Register, CiA 301: bit 0 generic, 1 current, 2 voltage,
  # 3 temperature, 5 device profile specific. The OR over all axes.
  - {index: 0x1001, name: "Error Register",    type: u8,  access: ro, var: "ErrorRegister"}
  - {index: 0x1008, name: "Device Name",       type: string, value: "cmc_drive"}
  - {index: 0x1009, name: "Hardware Version",  type: string, value: "1.0"}
  - {index: 0x100A, name: "Software Version",  type: string, value: "0.1"}

  # Store Parameters and Restore Default Parameters, CiA 301. Writing "save"
  # (0x65766173) to 0x1010:01 saves every entry marked `store: true` below;
  # writing "load" (0x64616F6C) to 0x1011:01 deletes the saved set, and the
  # defaults return at the next restart. Both reply only once the file is
  # written or removed, and both are refused in Operation Enabled. Reading
  # either returns 1: saves on command, never autonomously.
  - index: 0x1010
    name: "Store Parameters"
    object_code: array
    subs:
      - {sub: 1, name: "Save All Parameters",    type: u32, access: rw, var: "StoreParameters", value: 1}
  - index: 0x1011
    name: "Restore Default Parameters"
    object_code: array
    subs:
      - {sub: 1, name: "Restore All Defaults",   type: u32, access: rw, var: "RestoreParameters", value: 1}

  - index: 0x1018
    name: "Identity Object"
    type: record
    subs:
      - {sub: 1, name: "Vendor ID",     type: u32, access: ro, value: "@vendor_id"}
      - {sub: 2, name: "Product Code",  type: u32, access: ro, value: "@product_code"}
      - {sub: 3, name: "Revision",      type: u32, access: ro, value: "@revision"}
      - {sub: 4, name: "Serial Number", type: u32, access: ro, var: "serial"}

  # SyncManager synchronisation parameters, one object per process data SM.
  # ETG.1020. A master reads these to learn what the device can sustain and
  # writes :01 and :02 to say what it has configured, which is what makes an
  # honest :05 worth carrying: comparing the master's SYNC0 period against it
  # turns a class of silent misconfiguration into a specific AL status code
  # (see docs/stack-review.md 5.2). The sparse sub-indices are the standard
  # ones; sub 0 reports 0x20 because that is the highest defined entry, not
  # how many are implemented.
  - index: 0x1C32
    name: "SM2 Sync Parameters"
    type: record
    subs:
      - {sub: 0x01, name: "Sync Mode",             type: u16,  access: rw, var: "SM2Sync.SyncMode"}
      - {sub: 0x02, name: "Cycle Time",            type: u32,  access: rw, var: "SM2Sync.CycleTime"}
      # Interim floor. The EtherCAT half of a cycle measured 93 us median and
      # 148 us p99 at 25 MHz with four axes' worth of process data; this leaves
      # margin but does NOT yet account for the TMC4671 transactions that will
      # share the same thread. Revisit once the drive half is in the loop --
      # advertising a floor the device cannot hold is the same defect as
      # advertising a mode it does not implement.
      - {sub: 0x05, name: "Minimum Cycle Time",    type: u32,  access: ro, value: 250000, define: CMC_MIN_CYCLE_NS}
      - {sub: 0x0B, name: "SM Event Missed Count", type: u16,  access: ro, var: "SM2Sync.SMEventMissed"}
      - {sub: 0x20, name: "Sync Error",            type: bool, access: ro, var: "SM2Sync.SyncError"}

  - index: 0x1C33
    name: "SM3 Sync Parameters"
    type: record
    subs:
      - {sub: 0x01, name: "Sync Mode",             type: u16,  access: rw, var: "SM3Sync.SyncMode"}
      - {sub: 0x02, name: "Cycle Time",            type: u32,  access: rw, var: "SM3Sync.CycleTime"}
      - {sub: 0x05, name: "Minimum Cycle Time",    type: u32,  access: ro, value: 250000}
      - {sub: 0x0B, name: "SM Event Missed Count", type: u16,  access: ro, var: "SM3Sync.SMEventMissed"}
      - {sub: 0x20, name: "Sync Error",            type: bool, access: ro, var: "SM3Sync.SyncError"}

  - index: 0x10F1
    name: "Error Settings"
    type: record
    subs:
      - {sub: 1, name: "Local Error Reaction",     type: u32, access: rw, var: "ErrorSettings.LocalErrorReaction"}
      - {sub: 2, name: "Sync Error Counter Limit", type: u16, access: rw, var: "ErrorSettings.SyncErrorCounterLimit", value: 24}

  # --- CiA402, per axis ---------------------------------------------------
  # `axis: true` makes the generator emit one copy per axis at index + n*stride,
  # with the C variable becoming Obj.axis[n].<var>.
  - {index: 0x603F, axis: true, name: "Error Code",              type: u16, access: ro, var: "ErrorCode"}
  - {index: 0x6040, axis: true, name: "Controlword",             type: u16, access: rw, var: "Controlword"}
  - {index: 0x6041, axis: true, name: "Statusword",              type: u16, access: ro, var: "Statusword"}
  # Quick Stop: decelerate on 0x6085, then Switch On Disabled. The only code
  # implemented, so read-only rather than accepting values the drive ignores.
  - {index: 0x605A, axis: true, name: "Quick Stop Option Code",  type: i16, access: ro, var: "QuickStopOptionCode", value: 2}
  # Halt (controlword bit 8): decelerate on 0x6084 and hold in Operation
  # Enabled. The only code implemented.
  - {index: 0x605D, axis: true, name: "Halt Option Code",        type: i16, access: ro, var: "HaltOptionCode", value: 1}
  - {index: 0x6060, axis: true, name: "Modes of Operation",      type: i8,  access: rw, var: "ModesOfOperation"}
  - {index: 0x6061, axis: true, name: "Modes of Operation Display", type: i8, access: ro, var: "ModesOfOperationDisplay"}
  - {index: 0x6064, axis: true, name: "Position Actual Value",   type: i32, access: ro, var: "PositionActual"}
  # Following error supervision in cyclic synchronous position: outside the
  # window for longer than the timeout is a fault, error code 0x8611.
  # 0xFFFFFFFF switches supervision off.
  - {index: 0x6065, axis: true, name: "Following Error Window",  type: u32, access: rw, var: "FollowingErrorWindow", value: 8192, store: true}
  - {index: 0x6066, axis: true, name: "Following Error Time Out", type: u16, access: rw, var: "FollowingErrorTimeout", value: 50, store: true}
  - {index: 0x606C, axis: true, name: "Velocity Actual Value",   type: i32, access: ro, var: "VelocityActual"}
  - {index: 0x6071, axis: true, name: "Target Torque",           type: i16, access: rw, var: "TargetTorque"}
  - {index: 0x6072, axis: true, name: "Max Torque",              type: u16, access: rw, var: "MaxTorque", value: 1000, store: true}
  # Motor Rated Current, mA. The reference for 0x6071, 0x6072 and 0x6077:
  # the drive controls current, and per mille of rated current is per mille
  # of rated torque for a constant torque constant. 0 means not commissioned,
  # and cyclic synchronous torque is then refused.
  - {index: 0x6075, axis: true, name: "Motor Rated Current",     type: u32, access: rw, var: "MotorRatedCurrent", store: true}
  - {index: 0x6076, axis: true, name: "Motor Rated Torque",      type: u32, access: rw, var: "MotorRatedTorque", store: true}
  - {index: 0x6077, axis: true, name: "Torque Actual Value",     type: i16, access: ro, var: "TorqueActual"}
  - {index: 0x607A, axis: true, name: "Target Position",         type: i32, access: rw, var: "TargetPosition"}
  # Software position limits, in position units. The defaults span the full
  # range, which leaves them inactive.
  - index: 0x607D
    axis: true
    store: true
    name: "Software Position Limit"
    type: record
    subs:
      - {sub: 1, name: "Min Position Limit", type: i32, access: rw, var: "PositionLimitMin", value: -2147483648}
      - {sub: 2, name: "Max Position Limit", type: i32, access: rw, var: "PositionLimitMax", value: 2147483647}
  # Max Motor Speed, rpm: caps velocity targets and the velocity limit. The
  # default is the maxon EC-i 496654's no-load speed at 18 V.
  - {index: 0x6080, axis: true, name: "Max Motor Speed",         type: u32, access: rw, var: "MaxMotorSpeed", value: 7840, store: true}
  # Decelerations in rpm per second, the drive's velocity unit per second.
  - {index: 0x6084, axis: true, name: "Profile Deceleration",    type: u32, access: rw, var: "ProfileDeceleration", value: 10000, store: true}
  - {index: 0x6085, axis: true, name: "Quick Stop Deceleration", type: u32, access: rw, var: "QuickStopDeceleration", value: 10000, store: true}
  - {index: 0x60F4, axis: true, name: "Following Error Actual",  type: i32, access: ro, var: "FollowingErrorActual"}
  - {index: 0x60FF, axis: true, name: "Target Velocity",         type: i32, access: rw, var: "TargetVelocity"}
  # Bits 7, 8, 9: csp, csv, cst. Bit 16: manufacturer mode -1, identification.
  - {index: 0x6502, axis: true, name: "Supported Drive Modes",   type: u32, access: ro, value: 0x00010380}

  # Scaling. SDO-only, but a master cannot convert increments to user units
  # without them -- TwinCAT NC in particular.
  # Position units are fixed: 65536 counts per motor revolution, no gearing,
  # one position unit per count. Read-only so a master sees the truth; applying
  # a configurable factor group is a later feature.
  - index: 0x608F
    axis: true
    name: "Position Encoder Resolution"
    type: record
    subs:
      - {sub: 1, name: "Encoder Increments",  type: u32, access: ro, var: "EncoderIncrements", value: 65536}
      - {sub: 2, name: "Motor Revolutions",   type: u32, access: ro, var: "MotorRevolutions", value: 1}
  - index: 0x6091
    axis: true
    name: "Gear Ratio"
    type: record
    subs:
      - {sub: 1, name: "Motor Revolutions",   type: u32, access: ro, var: "GearMotorRevolutions", value: 1}
      - {sub: 2, name: "Shaft Revolutions",   type: u32, access: ro, var: "GearShaftRevolutions", value: 1}
  - index: 0x6092
    axis: true
    name: "Feed Constant"
    type: record
    subs:
      - {sub: 1, name: "Feed",                type: u32, access: ro, var: "Feed", value: 65536}
      - {sub: 2, name: "Shaft Revolutions",   type: u32, access: ro, var: "FeedShaftRevolutions", value: 1}

  # --- vendor range -------------------------------------------------------
  # Safety and task critical flags are cyclic; everything else is SDO-only.
  # The gate driver word is a direct mirror of the TMC6200 GSTAT register so
  # there is no translation layer to get wrong and the master sees exactly
  # what the driver reports.
  - index: 0x2000
    axis: true
    name: "Drive Faults and Status"
    type: record
    subs:
      - {sub: 1, name: "Gate Driver Faults", type: u16, access: ro, var: "GateDriverFaults"}
      - {sub: 2, name: "Drive Status Flags", type: u16, access: ro, var: "DriveStatusFlags"}

  - index: 0x2001
    axis: true
    name: "Board Telemetry"
    type: record
    subs:
      - {sub: 1, name: "Supply Voltage mV",   type: u32, access: ro, var: "SupplyVoltage_mV"}
      - {sub: 2, name: "Motor Temp mC",       type: i32, access: ro, var: "MotorTemp_mC"}
      - {sub: 3, name: "MOSFET Temp mC",      type: i32, access: ro, var: "MosfetTemp_mC"}
      # Cycles between samples of this record and 0x2002; 0 stops sampling.
      # Each sample costs SPI time in that cycle, so this is also a diagnostic
      # switch for disturbances in step with it.
      - {sub: 4, name: "Sample Period",       type: u16, access: rw, var: "BoardTelemetryPeriod", value: 50, store: true}

  # Phase currents in mA, the TMC4671's measured values after its own offset
  # and scale correction. Sampled at a low rate, like 0x2001.
  - index: 0x2002
    axis: true
    name: "Phase Currents"
    type: record
    subs:
      - {sub: 1, name: "Current U", type: i16, access: ro, var: "CurrentU"}
      - {sub: 2, name: "Current V", type: i16, access: ro, var: "CurrentV"}
      - {sub: 3, name: "Current W", type: i16, access: ro, var: "CurrentW"}

  # ADC self-calibration, measured at bring-up: raw ADC codes, 0..65535. The
  # single-ended channels are switched to the chip's internal 25 %, 50 % and
  # 75 % reference inputs and back; the current-sense channels are read with no
  # current flowing. Measurements only -- the corrections derived from them
  # come later, once real numbers have been seen.
  - index: 0x2003
    axis: true
    name: "ADC Self-Calibration"
    type: record
    subs:
      - {sub: 1,  name: "VM at 25% ref",     type: u16, access: ro, var: "AdcCalVm25"}
      - {sub: 2,  name: "VM at 50% ref",     type: u16, access: ro, var: "AdcCalVm50"}
      - {sub: 3,  name: "VM at 75% ref",     type: u16, access: ro, var: "AdcCalVm75"}
      - {sub: 4,  name: "AGPI_A at 25% ref", type: u16, access: ro, var: "AdcCalAgpiA25"}
      - {sub: 5,  name: "AGPI_A at 50% ref", type: u16, access: ro, var: "AdcCalAgpiA50"}
      - {sub: 6,  name: "AGPI_A at 75% ref", type: u16, access: ro, var: "AdcCalAgpiA75"}
      - {sub: 7,  name: "AGPI_B at 25% ref", type: u16, access: ro, var: "AdcCalAgpiB25"}
      - {sub: 8,  name: "AGPI_B at 50% ref", type: u16, access: ro, var: "AdcCalAgpiB50"}
      - {sub: 9,  name: "AGPI_B at 75% ref", type: u16, access: ro, var: "AdcCalAgpiB75"}
      - {sub: 10, name: "I0 at zero current", type: u16, access: ro, var: "AdcCalI0Zero"}
      - {sub: 11, name: "I1 at zero current", type: u16, access: ro, var: "AdcCalI1Zero"}
      - {sub: 12, name: "VM pin",            type: u16, access: ro, var: "AdcCalVmPin"}
      - {sub: 13, name: "AGPI_A pin",        type: u16, access: ro, var: "AdcCalAgpiAPin"}
      - {sub: 14, name: "AGPI_B pin",        type: u16, access: ro, var: "AdcCalAgpiBPin"}

  # Register Monitor, a diagnostic: the cyclic thread reads Data Register of
  # the motion controller every cycle and reports it in Value, first writing
  # Select Value into Select Register if one is named. Only the TMC4671's two
  # monitor selectors may be named (0x6D PID_ERROR_ADDR, 0x6F INTERIM_ADDR);
  # any other is ignored. Data Register 0 turns the monitor off. This is how
  # chip internals are read now that no adapter may touch the chip.
  - index: 0x2005
    axis: true
    name: "Register Monitor"
    type: record
    subs:
      - {sub: 1, name: "Data Register",   type: u8,  access: rw, var: "MonitorDataRegister"}
      - {sub: 2, name: "Select Register", type: u8,  access: rw, var: "MonitorSelectRegister"}
      - {sub: 3, name: "Select Value",    type: u8,  access: rw, var: "MonitorSelectValue"}
      - {sub: 4, name: "Value",           type: i32, access: ro, var: "MonitorValue"}

  # Control loop tuning, in the TMC4671's own register units -- the same
  # numbers as foc.* in bsp.yaml, which seed these at startup. Writable at any
  # time so the loops can be tuned live; a change reaches the chip within one
  # cycle. Stored by 0x1010, which then overrides bsp.yaml at startup.
  - index: 0x2010
    axis: true
    store: true
    name: "Control Loop Tuning"
    type: record
    subs:
      - {sub: 1, name: "Torque P",       type: u16, access: rw, var: "TorqueP"}
      - {sub: 2, name: "Torque I",       type: u16, access: rw, var: "TorqueI"}
      - {sub: 3, name: "Flux P",         type: u16, access: rw, var: "FluxP"}
      - {sub: 4, name: "Flux I",         type: u16, access: rw, var: "FluxI"}
      - {sub: 5, name: "Velocity P",     type: u16, access: rw, var: "VelocityP"}
      - {sub: 6, name: "Velocity I",     type: u16, access: rw, var: "VelocityI"}
      - {sub: 7, name: "Position P",     type: u16, access: rw, var: "PositionP"}
      - {sub: 8, name: "Position I",     type: u16, access: rw, var: "PositionI"}
      - {sub: 9, name: "Velocity Limit", type: u32, access: rw, var: "VelocityLimit"}
      # Velocity feed-forward in CSP, per mille of the target's own speed
      # (computed from the change in target position each cycle) added to the
      # velocity loop's target. Without it the position loop lags in
      # proportion to speed (measured: 40-75 counts per rpm). 0 turns it off.
      - {sub: 10, name: "Velocity Feed-Forward", type: u16, access: rw, var: "VelocityFeedForward", value: 1000}

  # Gains for the advanced (sequential) PI structure, kept apart from 0x2010
  # so the classic tuning survives a trial of the other. Same order as 0x2010.
  # Position P and velocity I are Q4.12, the rest Q8.8 (ADVANCED_PI_REPRESENT);
  # the velocity loop runs at the PWM rate. Velocity Filter is the cutoff of
  # the second-order low-pass on measured velocity, 0 off. The velocity limit
  # is 0x2010:09 for both. Seeded from foc_advanced in bsp.yaml.
  - index: 0x2011
    axis: true
    store: true
    name: "Advanced Loop Tuning"
    type: record
    subs:
      - {sub: 1, name: "Torque P",        type: u16, access: rw, var: "AdvTorqueP"}
      - {sub: 2, name: "Torque I",        type: u16, access: rw, var: "AdvTorqueI"}
      - {sub: 3, name: "Flux P",          type: u16, access: rw, var: "AdvFluxP"}
      - {sub: 4, name: "Flux I",          type: u16, access: rw, var: "AdvFluxI"}
      - {sub: 5, name: "Velocity P",      type: u16, access: rw, var: "AdvVelocityP"}
      - {sub: 6, name: "Velocity I",      type: u16, access: rw, var: "AdvVelocityI"}
      - {sub: 7, name: "Position P",      type: u16, access: rw, var: "AdvPositionP"}
      - {sub: 8, name: "Position I",      type: u16, access: rw, var: "AdvPositionI"}
      - {sub: 9, name: "Velocity Filter", type: u16, access: rw, var: "AdvVelocityFilterHz"}

  # Which loop structure runs: 0 classic PI with the TMC4671's standard
  # velocity meter (fixed 20 Hz filter) and the 0x2010 gains; 1 advanced PI
  # with the PWM-synchronous meter, the 0x2011 filter and gains. Only while no
  # axis is in Operation Enabled.
  - {index: 0x2012, axis: true, name: "Loop Structure", type: u8, access: rw, var: "LoopStructure", store: true, disabled_only: true}

  # Anti-cogging: a torque the drive adds as a function of shaft angle,
  # measured once with tools/twincat/cogging.py and held in 0x2014. The angle
  # is counted from the encoder's index pulse, so it is the same after every
  # power-up; until the motor has passed the index once, Status reads 1 and
  # nothing is added. Gain scales the table (per mille); the compensation is
  # full up to Fade Speed and falls to nothing at twice it (rpm), where the
  # rotor's inertia smooths cogging anyway.
  - index: 0x2013
    axis: true
    name: "Anti-Cogging"
    type: record
    subs:
      - {sub: 1, name: "Enable",      type: u8,  access: rw, var: "CoggingEnable", store: true}
      - {sub: 2, name: "Gain",        type: u16, access: rw, var: "CoggingGain", value: 1000, store: true}
      - {sub: 3, name: "Fade Speed",  type: u16, access: rw, var: "CoggingFadeRpm", value: 300, store: true}
      - {sub: 4, name: "Status",      type: u8,  access: ro, var: "CoggingStatus"}
      - {sub: 5, name: "Shaft Angle", type: u16, access: ro, var: "ShaftAngle"}
      # Between minus and plus this speed (rpm) the two direction tables are
      # blended in proportion; at standstill their average applies.
      - {sub: 6, name: "Blend Speed", type: u16, access: rw, var: "CoggingBlendRpm", value: 10, store: true}

  # The anti-cogging tables: 128 points over one revolution from the index,
  # in per mille of 0x6075 Motor Rated Current, interpolated linearly between
  # points: the angle-dependent part of the torque the motor needs at each
  # angle to turn smoothly, for positive (0x2014) and negative (0x2015)
  # rotation. Part of it depends on direction (friction varying around the
  # turn). A 0x2015 left all zero means 0x2014 serves both directions.
  - index: 0x2014
    axis: true
    store: true
    name: "Anti-Cogging Table"
    object_code: array
    elements: {count: 128, type: i16, access: rw, var: "CoggingTable", name: "Point"}
  - index: 0x2015
    axis: true
    store: true
    name: "Anti-Cogging Table Negative"
    object_code: array
    elements: {count: 128, type: i16, access: rw, var: "CoggingTableNeg", name: "Point"}

  # Signals inside the drive's control, as objects so the recorder (0x2020)
  # and any client can see them.
  - index: 0x2016
    axis: true
    name: "Loop Signals"
    type: record
    subs:
      - {sub: 1, name: "Velocity Feed-Forward", type: i32, access: ro, var: "SigVelocityFeedForward"}
      - {sub: 2, name: "Cogging Torque mA",     type: i32, access: ro, var: "SigCoggingTorque"}

  # The recorder: up to 8 channels, each naming an object in the PDO mapping
  # format (index << 16 | sub << 8, the low byte ignored), sampled by the
  # cyclic thread every Divider cycles into 0x2021. Command 1 arms it, 2
  # triggers at once, 3 stops. With Trigger Channel 0 it records from the moment
  # it is armed; otherwise it keeps Pre-Trigger samples and records the rest
  # once that channel crosses Trigger Level (Edge 1 rising, 2 falling, 3
  # either). State: 0 idle, 1 armed, 2 recording, 3 done, 4 refused (a channel
  # names no recordable object, or the record would not fit).
  - index: 0x2020
    name: "Recorder"
    type: record
    subs:
      - {sub: 1,  name: "Command",           type: u8,  access: rw, var: "RecCommand"}
      - {sub: 2,  name: "State",             type: u8,  access: ro, var: "RecState"}
      - {sub: 3,  name: "Divider",           type: u16, access: rw, var: "RecDivider", value: 1}
      - {sub: 4,  name: "Samples",           type: u16, access: rw, var: "RecSamples", value: 2000}
      - {sub: 5,  name: "Pre-Trigger",       type: u16, access: rw, var: "RecPreTrigger"}
      - {sub: 6,  name: "Trigger Channel",   type: u8,  access: rw, var: "RecTriggerChannel"}
      - {sub: 7,  name: "Trigger Edge",      type: u8,  access: rw, var: "RecTriggerEdge", value: 1}
      - {sub: 8,  name: "Trigger Level",     type: i32, access: rw, var: "RecTriggerLevel"}
      - {sub: 9,  name: "Channels Recorded", type: u8,  access: ro, var: "RecChannels"}
      - {sub: 10, name: "Samples Recorded",  type: u16, access: ro, var: "RecRecorded"}
      - {sub: 11, name: "Data Length",       type: u32, access: ro, var: "RecorderDataLength"}
      - {sub: 12, name: "Channel 1",         type: u32, access: rw, var: "RecChannel1"}
      - {sub: 13, name: "Channel 2",         type: u32, access: rw, var: "RecChannel2"}
      - {sub: 14, name: "Channel 3",         type: u32, access: rw, var: "RecChannel3"}
      - {sub: 15, name: "Channel 4",         type: u32, access: rw, var: "RecChannel4"}
      - {sub: 16, name: "Channel 5",         type: u32, access: rw, var: "RecChannel5"}
      - {sub: 17, name: "Channel 6",         type: u32, access: rw, var: "RecChannel6"}
      - {sub: 18, name: "Channel 7",         type: u32, access: rw, var: "RecChannel7"}
      - {sub: 19, name: "Channel 8",         type: u32, access: rw, var: "RecChannel8"}

  # The record: Samples Recorded samples, oldest first, each the recorded
  # channels in order as little-endian int32. Readable once State is 3;
  # otherwise the read is refused with 0x08000024, no data available.
  - {index: 0x2021, name: "Recorder Data", type: domain, size: 131072, access: ro, var: "RecorderData", length_var: "RecorderDataLength"}

  # Identification, run in mode of operation -1: controlword bit 4 starts the
  # routine; statusword bit 10 finished, 12 succeeded, 13 failed. Routine 1
  # measures the motor's resistance and inductance at standstill with a d-axis
  # current, which makes no torque, of up to Test Current (per mille of 0x6075).
  # Results are phase to phase, as motor datasheets give them. State: 0 idle,
  # 1 running, 2 done, 3 failed. Error: 0 none, 1 not ready (encoder not
  # calibrated, motor turning, no supply or 0x6075 unset), 2 current not
  # reached (open phase), 3 overcurrent, 4 fit failed, 5 aborted, 6 unknown
  # routine, 7 rotor moved. Fit Quality: the step response fit's R squared.
  - index: 0x2030
    axis: true
    name: "Identification"
    type: record
    subs:
      - {sub: 1, name: "Routine",            type: u8,  access: rw, var: "IdentRoutine", value: 1}
      - {sub: 2, name: "Test Current",       type: u16, access: rw, var: "IdentTestCurrent", value: 300, store: true}
      - {sub: 3, name: "State",              type: u8,  access: ro, var: "IdentState"}
      - {sub: 4, name: "Error",              type: u8,  access: ro, var: "IdentError"}
      - {sub: 5, name: "Resistance mOhm",    type: u32, access: ro, var: "IdentResistance"}
      - {sub: 6, name: "Inductance uH",      type: u32, access: ro, var: "IdentInductance"}
      - {sub: 7, name: "Time Constant us",   type: u32, access: ro, var: "IdentTimeConstant"}
      - {sub: 8, name: "Supply Voltage mV",  type: u32, access: ro, var: "IdentSupply"}
      - {sub: 9, name: "Fit Quality",        type: u16, access: ro, var: "IdentFitQuality"}

# ---------------------------------------------------------------------------
# Bit assignments for the two cyclic vendor words. Documented here rather than
# only in C so the master side and the drive side have one source.
# ---------------------------------------------------------------------------

bitfields:
  GateDriverFaults:
    # Direct mirror of TMC6200 GSTAT (see cmc include/tmc/TMC6200.hpp).
    0:  reset
    1:  drv_otpw          # over-temperature warning
    2:  drv_ot            # over-temperature
    3:  uv_cp             # charge pump undervoltage
    4:  shortdet_u
    5:  s2g_u             # short to ground, phase U
    6:  s2vs_u            # short to supply, phase U
    8:  shortdet_v
    9:  s2g_v
    10: s2vs_v
    12: shortdet_w
    13: s2g_w
    14: s2vs_w

  DriveStatusFlags:
    # Board digital inputs (cmc include/bsp/BSP.hpp) plus the TMC4671 status
    # bits that matter within a cycle rather than as diagnostics.
    0:  drv_fault_pin     # BSP DRV_FAULT, BCM 27
    1:  ctrl_sta_pin      # BSP CTRL_STA,  BCM 26
    2:  is_ctrl_en_pin    # BSP IS_CTRL_EN, BCM 24
    4:  adc_i_clipped     # current measurement saturated
    5:  aenc_clipped
    6:  pid_iq_output_limit
    7:  pid_id_output_limit
    8:  pwm_min
    9:  pwm_max
    10: enc_n             # encoder index seen
    11: hall_error

# ---------------------------------------------------------------------------
# EEPROM / SII image data.
#
# config_data is the first eight SII bytes, mapping onto ESC registers:
#   byte 0-1 -> 0x0140/0x0141 PDI Control and ESC Configuration
#   byte 2   -> 0x0150        PDI Configuration
#   byte 3   -> 0x0151        Sync/Latch PDI Configuration
#   byte 4-5 -> 0x0982/0x0983 Sync pulse length, in 10 ns units
#
# Byte 3 = 0x0E is what makes SYNC0 an output at all: bit 2 selects SYNC0
# output over LATCH0 input, bits 1:0 select push-pull active high, and bit 3
# maps SYNC0 into the AL event register. It is loaded from EEPROM at reset and
# is not writable from the PDI, so the EEPROM must be reflashed and the device
# power cycled for a change here to take effect. See roadmap section 3.3.0.
# ---------------------------------------------------------------------------
eeprom:
  byte_size:       2048
  config_data:     "8002000E64000000"
  assign_activate: "#x300"      # cyclic unit + SYNC0, no SYNC1
