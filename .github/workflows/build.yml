name: build
on: [push, pull_request]
env:
  BUILD_TYPE: Release
jobs:
  build:
    # ubuntu-20.04 was retired, which silently stopped this workflow running
    # at all. Pin to a supported image rather than to a number that expires.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The generated object dictionary is committed, so the first thing to
      # establish is that it still matches its YAML source and that what the
      # generator emits is internally consistent. See tools/check_od.sh.
      - name: Check the object dictionary
        run: |
          python3 -m pip install --quiet pyyaml
          sh tools/check_od.sh

      # One configuration per application, and per dictionary variant: the soes
      # library compiles against whichever one supplies ecat_options.h, so they
      # cannot share a build directory. Every variant is built because a defect
      # that only appears in the four-axis image is exactly the kind that
      # otherwise reaches hardware.
      - name: Build
        run: |
          cmake -B build/lan9252_diag -S . -DCMAKE_BUILD_TYPE=$BUILD_TYPE
          cmake --build build/lan9252_diag -j4
          for v in applications/cia402_drive/variants/*.yaml; do
            name=$(basename "$v" .yaml)
            cmake -B "build/$name" -S . -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
              -DSOES_DEMO=applications/cia402_drive -DCMC_VARIANT="$name"
            cmake --build "build/$name" -j4
          done
